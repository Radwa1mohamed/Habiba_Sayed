<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آراء العملاء | Habiba Sayed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #081b25;
            --bg-light: #102c3b;
            --primary: #62BEAC;
            --secondary: #E056A0;
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.7);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top right, rgba(224, 86, 160, 0.12), transparent 30%),
                        radial-gradient(circle at bottom left, rgba(98, 190, 172, 0.12), transparent 30%),
                        linear-gradient(180deg, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header Section */
        .feedback-page-header {
            padding: 120px 20px 60px;
            text-align: center;
            position: relative;
        }

        .feedback-page-header h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--text);
        }

        .feedback-page-header p {
            color: var(--muted);
            font-size: 1.1rem;
            max-width: 650px;
            margin: auto;
            margin-bottom: 25px;
        }

        .scroll-to-form-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(98, 190, 172, 0.15);
        }

        .scroll-to-form-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(98, 190, 172, 0.3);
        }

        .scroll-to-form-btn i {
            animation: bounceDown 1.5s infinite;
        }

        @keyframes bounceDown {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(5px); }
            60% { transform: translateY(3px); }
        }

        .back-home {
            position: absolute;
            top: 40px;
            right: 5%;
            padding: 10px 22px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .back-home:hover {
            background: var(--primary);
            color: var(--bg-dark);
            transform: translateX(-5px);
        }

        /* Form Section Styles */
        .add-feedback-section {
            max-width: 800px;
            margin: 40px auto 20px;
            padding: 0 5%;
        }

        .feedback-form-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .feedback-form-card h3 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(98, 190, 172, 0.3);
        }

        .star-rating {
            display: flex;
            gap: 8px;
            direction: ltr;
            justify-content: flex-end;
            padding-top: 8px;
        }

        .star-rating i {
            font-size: 1.5rem;
            color: var(--border);
            cursor: pointer;
            transition: 0.2s;
        }

        .star-rating i.active,
        .star-rating i:hover,
        .star-rating i:hover ~ i {
            color: #ffc107;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, var(--primary), #48a392);
            color: var(--bg-dark);
            font-weight: 800;
            font-size: 1.05rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(98, 190, 172, 0.3);
        }

        /* Success Message Overlay */
        .success-overlay {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 27, 37, 0.9);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
        }

        .success-card {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: zoomEffect 0.3s ease;
        }

        .success-card i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .success-card h3 {
            color: var(--text);
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .success-card p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .success-card button {
            padding: 10px 30px;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }

        .success-card button:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        /* Square Grid Layout */
        .feedback-full-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 5% 40px;
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Square Card Style */
        .screenshot-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 12px;
            border: 1px solid var(--border);
            backdrop-filter: blur(14px);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
        }

        .screenshot-card:hover {
            transform: translateY(-10px);
            border-color: var(--secondary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .img-wrapper {
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1 / 1;
            background: rgba(0,0,0,0.2);
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.6s ease;
        }

        .screenshot-card:hover img {
            transform: scale(1.1);
        }

        /* Hover Overlay */
        .hover-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 27, 37, 0.4);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }

        .screenshot-card:hover .hover-overlay {
            opacity: 1;
        }

        .hover-overlay i {
            color: white;
            font-size: 1.2rem;
            background: var(--secondary);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Fullscreen Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 27, 37, 0.98);
            backdrop-filter: blur(15px);
            padding: 20px;
            cursor: zoom-out;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 95%;
            max-height: 85vh;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            animation: zoomEffect 0.3s ease;
            border: 2px solid var(--border);
        }

        @keyframes zoomEffect {
            from {transform: scale(0.8); opacity: 0;}
            to {transform: scale(1); opacity: 1;}
        }

        .close-modal {
            position: absolute;
            top: 25px; left: 25px;
            color: var(--primary);
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .feedback-page-header { padding-top: 100px; }
            .back-home { top: 20px; right: 20px; padding: 8px 15px; font-size: 0.85rem; }
            .feedback-full-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding-bottom: 40px; }
            .feedback-form-card { padding: 20px; }
        }

        .footer-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 40px;
            border-radius: 60px;
            background: linear-gradient(45deg, var(--secondary), #ff82c0);
            color: white;
            font-weight: 800;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(224, 86, 160, 0.2);
        }

        .footer-back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(224, 86, 160, 0.4);
            color: white;
        }

        .footer-back-btn i {
            font-size: 1.1rem;
        }
    </style>
</head>

    <!-- قسم إضافة رأي جديد مربوط بـ FormSubmit -->
    <section class="add-feedback-section" id="feedbackFormSection">
        <div class="feedback-form-card">
            <h3><i class="fa-solid fa-pen-to-square"></i> شاركنا بريك</h3>
            <form action="https://formsubmit.co/habobsayed53@gmail.com" method="POST" class="booking-form" id="clientFeedbackForm">
                
                <!-- إعدادات إضافية لـ Formsubmit وتوجيه رسالة النجاح -->
                <input type="hidden" name="_subject" value="رأي جديد من موقعك الشخصي!">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="clientName">الاسم الكامل <span style="color: var(--muted); font-size: 0.85rem; font-weight: 400;">(اختياري)</span></label>
                        <input type="text" name="الاسم" id="clientName" placeholder="أدخل اسمك">
                    </div>
                    <div class="form-group">
                        <label for="clientRole">المسمى الوظيفي / الشركة <span style="color: var(--muted); font-size: 0.85rem; font-weight: 400;">(اختياري)</span></label>
                        <input type="text" name="المسمى_الوظيفي" id="clientRole" placeholder="مثال: مدير تسويق">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="clientMessage">اضافه تعليقك هنا </label>
                        <input type="text" name="الرسالة_المختصرة" id="clientMessage" placeholder="اكتب رسالتك هنا..." required>
                    </div>
                    <div class="form-group">
                        <label>التقييم</label>
                        <input type="hidden" name="التقييم" id="ratingInput" value="5">
                        <div class="star-rating" id="starRating">
                            <i class="fa-solid fa-star active" data-value="5"></i>
                            <i class="fa-solid fa-star active" data-value="4"></i>
                            <i class="fa-solid fa-star active" data-value="3"></i>
                            <i class="fa-solid fa-star active" data-value="2"></i>
                            <i class="fa-solid fa-star active" data-value="1"></i>
                        </div>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="clientComment">رأيك أو تجربتك معنا</label>
                    <textarea name="تفاصيل_الرأي" id="clientComment" rows="4" placeholder="اكتب تفاصيل تجربتك هنا..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    إرسال الرأي <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </section>

    <script>
       
       
        function openModal(src) {
            const modal = document.getElementById('imageModal');
            const fullImg = document.getElementById('imgFull');
            fullImg.src = src;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.body.style.overflow = 'auto'; 
        }

        // الدالة الجديدة اللي أضفناها عشان تقفل الخلفية بأمان
        function closeModalOnBackground(event) {
            if (event.target.id === 'imageModal') {
                closeModal();
            }
        }
        function closeSuccessModal() {
            document.getElementById('successModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('clientFeedbackForm').reset();
        }
        
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
                closeSuccessModal();
            }
        });

        /* Star Rating Functionality */
        const stars = document.querySelectorAll('#starRating i');
        const ratingInput = document.getElementById('ratingInput');
        let selectedRating = 5;

        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = this.getAttribute('data-value');
                ratingInput.value = selectedRating + ' نجوم';
                stars.forEach(s => {
                    if (parseInt(s.getAttribute('data-value')) <= parseInt(selectedRating)) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });

        /* Ajax Submit Handler for FormSubmit to show Success Custom Message */
        const form = document.getElementById('clientFeedbackForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('successModal').style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                } else {
                    alert('حدث خطأ أثناء الإرسال، يجدر المحاولة لاحقاً.');
                }
            }).catch(error => {
                alert('حدث خطأ في الاتصال بالشبكة.');
            });
        });
    </script>
